apiVersion: apps/v1
kind: Deployment
metadata:
  name: dic-fe
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dic-fe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dic-fe
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dic-fe
          image: registry.example.invalid/dataworks/dic-fe@sha256:${DIC_FE_IMAGE_DIGEST}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dic-fe
spec:
  selector:
    app.kubernetes.io/name: dic-fe
  ports:
    - {name: http, port: 8080, targetPort: http}
