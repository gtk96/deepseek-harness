apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dsh-runtime
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-controlled-data-query
  target:
    name: dsh-runtime
    creationPolicy: Owner
  data:
    - secretKey: DEEPSEEK_API_KEY
      remoteRef:
        key: controlled-data-query/dsh
        property: deepseek-api-key
    - secretKey: DATA_AID_QUERY_ASSERTION_KEY_RING
      remoteRef:
        key: controlled-data-query/trust
        property: assertion-key-ring
    - secretKey: DATA_AID_QUERY_ASSERTION_ACTIVE_KID
      remoteRef:
        key: controlled-data-query/trust
        property: assertion-active-kid
    - secretKey: DATA_AID_INGRESS_SERVICE_TOKEN
      remoteRef:
        key: controlled-data-query/trust
        property: ingress-service-token
    - secretKey: DATA_AID_TURN_CALLBACK_SERVICE_TOKEN
      remoteRef:
        key: controlled-data-query/trust
        property: callback-service-token
---
