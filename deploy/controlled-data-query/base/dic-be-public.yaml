apiVersion: apps/v1
kind: Deployment
metadata:
  name: dic-be-public
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dic-be-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dic-be-public
        app.kubernetes.io/component: public
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dic-be-public
          image: registry.example.invalid/dataworks/dic-be@sha256:${DIC_BE_IMAGE_DIGEST}
          imagePullPolicy: IfNotPresent
          command: ["gunicorn"]
          args: ["app.main:app", "-k", "uvicorn.workers.UvicornWorker", "-b", "0.0.0.0:8000", "--workers", "1", "--timeout", "660"]
          env:
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: dic-be-public-runtime, key: JWT_SECRET}}
            - name: TIDB_PASSWORD
              valueFrom: {secretKeyRef: {name: dic-be-public-runtime, key: TIDB_PASSWORD}}
            - name: DSH_TURN_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: dic-be-public-runtime, key: DSH_TURN_SERVICE_TOKEN}}
          envFrom:
            - configMapRef:
                name: dic-be-database-config
            - configMapRef:
                name: dic-be-common-config
            - configMapRef:
                name: dic-be-public-config
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health/check
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dic-be-public
spec:
  selector:
    app.kubernetes.io/name: dic-be-public
  ports:
    - {name: http, port: 8000, targetPort: http}
