apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dsh
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsh
        app.kubernetes.io/component: agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dsh
          image: registry.example.invalid/dataworks/dsh@sha256:${DSH_IMAGE_DIGEST}
          imagePullPolicy: IfNotPresent
          command: ["node"]
          args: ["--expose-internals", "apps/cli/lib/bin.js", "--profile", "data-aid"]
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom: {secretKeyRef: {name: dsh-runtime, key: DEEPSEEK_API_KEY}}
            - name: DATA_AID_QUERY_ASSERTION_KEY_RING
              valueFrom: {secretKeyRef: {name: dsh-runtime, key: DATA_AID_QUERY_ASSERTION_KEY_RING}}
            - name: DATA_AID_QUERY_ASSERTION_ACTIVE_KID
              valueFrom: {secretKeyRef: {name: dsh-runtime, key: DATA_AID_QUERY_ASSERTION_ACTIVE_KID}}
            - name: DATA_AID_INGRESS_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: dsh-runtime, key: DATA_AID_INGRESS_SERVICE_TOKEN}}
            - name: DATA_AID_TURN_CALLBACK_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: dsh-runtime, key: DATA_AID_TURN_CALLBACK_SERVICE_TOKEN}}
          envFrom:
            - configMapRef:
                name: data-aid-config
          ports:
            - name: http
              containerPort: 3081
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/dsh
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: dsh
spec:
  selector:
    app.kubernetes.io/name: dsh
  ports:
    - name: http
      port: 3081
      targetPort: http
