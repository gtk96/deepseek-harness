# Local controlled Data Aid Query Broker smoke patch.
# Apply only to `dsh --profile data-aid`; it overrides existing controlled rows
# and cannot create a query capability in another profile.

- id: data-query-dic-be
  config:
    baseURL: !!js process.env.DATA_AID_QUERY_BASE_URL ?? 'http://127.0.0.1:3901'
    path: !!js process.env.DATA_AID_QUERY_PATH ?? '/query'
    issuer: dsh-test
    audience: dic-be-test
    assertionKeyRing: !!js JSON.parse(process.env.DATA_AID_QUERY_ASSERTION_KEY_RING ?? '{"local-active":"local-test-assertion-secret-32-bytes-minimum"}')
    assertionActiveKid: !!js process.env.DATA_AID_QUERY_ASSERTION_ACTIVE_KID ?? 'local-active'
    assertionTtlSeconds: 30
    timeoutSeconds: !!js Number(process.env.DATA_AID_QUERY_TIMEOUT_SECONDS ?? 15)
    maxRows: !!js Number(process.env.DATA_AID_QUERY_MAX_ROWS ?? 2)
    maxResultBytes: !!js Number(process.env.DATA_AID_QUERY_MAX_RESULT_BYTES ?? 4096)
